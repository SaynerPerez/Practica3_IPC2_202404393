{% extends 'productos/base.html' %}

{% block title %}{{ titulo }}{% endblock %}
{% block titulo_pagina %}{{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">Nombre del Producto *</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" 
                                   value="{{ producto.nombre|default:'' }}" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="categoria" class="form-label">Categoría *</label>
                            <input type="text" class="form-control" id="categoria" name="categoria" 
                                   value="{{ producto.categoria|default:'' }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcion" name="descripcion" 
                                  rows="3">{{ producto.descripcion|default:'' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="precio" class="form-label">Precio (Q) *</label>
                            <input type="number" step="0.01" class="form-control" id="precio" name="precio" 
                                   value="{{ producto.precio|default:'' }}" required>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label for="cantidad_stock" class="form-label">Cantidad en Stock *</label>
                            <input type="number" class="form-control" id="cantidad_stock" name="cantidad_stock" 
                                   value="{{ producto.cantidad_stock|default:'' }}" required>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label for="fecha_vencimiento" class="form-label">Fecha de Vencimiento</label>
                            <input type="date" class="form-control" id="fecha_vencimiento" name="fecha_vencimiento" 
                                   value="{{ producto.fecha_vencimiento|default:'' }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'lista_productos' %}" class="btn btn-secondary">← Cancelar</a>
                        <button type="submit" class="btn btn-success">
                            {% if es_edicion %}💾 Guardar Cambios{% else %}➕ Crear Producto{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
